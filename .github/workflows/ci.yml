name: Tests

# The production repo runs the backend suite on windows-latest before every
# PyInstaller build. The showcase has no GUI to package, so it just runs the
# suite — on Windows (where the shop's PC is) and Linux.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run the demo
        run: python -m shopledger.demo --out sample_invoice.pdf
